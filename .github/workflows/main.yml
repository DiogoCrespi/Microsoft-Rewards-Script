name: Run Microsoft Rewards Script

on:
    schedule:
        - cron: '0 7 * * *' # Runs at 07:00 UTC (04:00 AM UTC-3)
    workflow_dispatch: # Allows manual trigger

jobs:
    run-script:
        runs-on: ubuntu-latest

        steps:
            - name: Random Delay (0-30 min)
              run: |
                  echo "Sleeping for a random time..."
                  sleep $((RANDOM % 1800))

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set Custom DNS
              run: |
                  echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
                  echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
                  cat /etc/resolv.conf

            - name: Install and Configure Cloudflare WARP
              run: |
                  # Add Cloudflare GPG key
                  curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

                  # Add Cloudflare repo
                  echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

                  # Install WARP
                  sudo apt-get update && sudo apt-get install cloudflare-warp

                  # Register and Connect
                  sudo warp-cli --accept-tos registration new
                  sudo warp-cli --accept-tos mode warp+doh
                  sudo warp-cli --accept-tos connect

                  # Verify connection
                  sleep 10
                  curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp
                  curl -s https://ifconfig.me

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx patchright install chromium

            - name: Build Project
              run: npm run build

            - name: Run Script
              env:
                  ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
                  CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
                  TZ: 'America/Sao_Paulo' # Brasilia Time
              run: xvfb-run --auto-servernum npm start
